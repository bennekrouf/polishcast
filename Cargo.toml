[workspace]
resolver = "2"
members = ["crates/core", "crates/capture", "crates/render", "crates/export", "crates/app"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.5"
edition = "2021"
# Source-available under PolyForm Noncommercial 1.0.0: free for personal use,
# commercial use needs a licence. See LICENSE and TRADEMARK.md.
license-file = "LICENSE"

[workspace.dependencies]
small-video-core = { path = "crates/core" }
small-video-capture = { path = "crates/capture" }
small-video-render = { path = "crates/render" }
small-video-export = { path = "crates/export" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
dirs = "6"
dioxus = { version = "0.7", features = ["desktop"] }
tokio = { version = "1", features = ["time"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"

# Decoding and rendering are far too slow unoptimised; keep debug builds usable.
[profile.dev.package."*"]
opt-level = 3

# block 0.1.6 (via dioxus-desktop -> cocoa) is unmaintained and trips a future-incompat lint;
# vendor/block is the same release with that one type fixed (copied from splitter).
[patch.crates-io]
block = { path = "vendor/block" }
