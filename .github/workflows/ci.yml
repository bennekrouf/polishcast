name: CI

# Fast feedback on every branch and PR.
#
# release.yml is the heavy pipeline: it only runs on `v*` tags and takes ~15
# minutes to produce signed macOS/Windows artifacts. This workflow exists so
# that a regression `cargo test` can already see never costs you that round
# trip plus a download and a manual click-through.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── macOS: blocking ────────────────────────────────────────────────────────
  # The ScreenCaptureKit backend only builds here. Hosted runners have ffmpeg via Homebrew;
  # the export tests skip themselves where it's missing.
  check-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Installs the version and components rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  # ── Windows: blocking ──────────────────────────────────────────────────────
  # As in TrackCut: catches Windows-only breakage (the Windows.Graphics.Capture backend,
  # cfg(windows) code, WebView2, the MSVC build of ring) and runs the same tests there. The
  # windows-latest image has MSVC and the Windows SDK.
  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
