[package]
name = "polishcast"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Record your screen, get a polished video"

[dependencies]
# The Copy buttons in the "Use PolishCast from Claude" window: the native clipboard, since the
# web view's clipboard API needs a secure origin and a gesture check that differ per platform.
arboard = "3"
polishcast-core.workspace = true
polishcast-capture.workspace = true
polishcast-render.workspace = true
polishcast-export.workspace = true
anyhow.workspace = true
dioxus.workspace = true
# rt: measuring a take's loudness off the UI thread (spawn_blocking; Dioxus runs on tokio).
tokio = { workspace = true, features = ["rt"] }
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
# The update check reads latest.json, and the licence is checked with api0, both through the
# export crate's `http` agent (certificates checked by the OS), which fetches ffmpeg too.
ureq = "3.4.2"
# Decodes the embedded icons (window and menu bar); png is the only format needed.
image = { version = "0.25", default-features = false, features = ["png"] }
# Deleting a take moves its folder to the system Trash, so it can be restored (as in TrackCut).
trash = "5.2"
# Names each take's folder after the local time it started.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Leaving the app's own window out of screen recordings (SetWindowDisplayAffinity).
# Free disk space, to stop a forgotten recording before the disk fills.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
